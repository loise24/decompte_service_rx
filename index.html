<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SRT Décompte Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Plein écran quand lancé depuis l'écran d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Décompte">
<link rel="apple-touch-icon" href="app_icon.png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; overflow: hidden; background: #1e1e1e;
    font-family: -apple-system, Helvetica, Arial, sans-serif; color: #fff;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  #root { position: absolute; top: 0; left: 0; width: 100%; background: #1e1e1e;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    padding: 12px; box-sizing: border-box; }
  #top { height: 70px; text-align: center; }
  #top img { height: 70px; }
  #title { height: 7%; text-align: center; font-weight: bold; font-size: 22px; line-height: 1.6; }
  #lcdbox { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #lcd { font-weight: bold; white-space: nowrap; font-family: Menlo, "Courier New", monospace;
    font-size: 40px; line-height: 1; }
  #live { height: 6%; text-align: center; font-size: 18px; line-height: 2; }
  #pilot { height: 48px; font-size: 20px; color: #fff; background: rgba(255,255,255,.1);
    border: 0; border-radius: 6px; margin: 6px 0; -webkit-appearance: none; text-align: center;
    text-align-last: center; width: 100%; }
  #pilot option { color: #000; }
  #bottom { height: 48px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .t { width: 56px; height: 48px; font-size: 20px; text-align: center; color: rgba(255,255,255,.85);
    background: rgba(255,255,255,.12); border: 0; border-radius: 6px; -webkit-appearance: none;
    margin: 0; padding: 0; }
  .sep { width: 14px; text-align: center; font-size: 20px; color: rgba(255,255,255,.8); }
  .b { width: 80px; height: 48px; margin-left: 6px; font-size: 15px; color: rgba(255,255,255,.7);
    background: rgba(255,255,255,.10); border: 0; border-radius: 6px; -webkit-appearance: none; }
  .b:active { background: rgba(255,255,255,.3); }
  .bad { color: #ff4d4d !important; }
</style>
</head>
<body>
<div id="root">
  <div id="top"><img src="logo_blanc.png" alt="" onerror="this.style.display='none'"></div>
  <div id="title">TEMPS RESTANT SERVICE</div>
  <div id="lcdbox"><div id="lcd">00:00:00</div></div>
  <div id="live"></div>
  <select id="pilot">
    <option>Gautier SARHY #202</option>
    <option>Nom Prénom #000</option>
  </select>
  <div id="bottom">
    <input class="t" id="hh" type="tel" maxlength="2" placeholder="--">
    <div class="sep">:</div>
    <input class="t" id="mm" type="tel" maxlength="2" placeholder="--">
    <button class="b" id="go">Lancer</button>
    <button class="b" id="stop">Stop</button>
  </div>
</div>

<script>
(function () {
  var COLORS = { normal: "#1e1e1e", green: "#008000", orange: "#ffa500", red: "#ff0000",
                 flash_on: "#ff0000", flash_off: "#1e1e1e", zero: "#808080" };
  var $ = function (id) { return document.getElementById(id); };
  var root = $("root"), lcd = $("lcd"), box = $("lcdbox"), live = $("live");
  var hh = $("hh"), mm = $("mm");
  var target = null, running = false, flash = false;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Hauteur réelle de l'écran (100vh est faux sur le vieux Safari)
  function layout() {
    var h = window.innerHeight;
    root.style.height = h + "px";
    document.body.style.height = h + "px";
    // Taille du décompte : équivalent de _fit_lcd du code Kivy
    var w = box.clientWidth, bh = box.clientHeight;
    var size = Math.max(20, Math.min(w / 5.2, bh * 0.9));
    lcd.style.fontSize = size + "px";
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 200); });

  function setBg(state) {
    var c = COLORS[state];
    root.style.background = c;
    document.body.style.background = c;
    document.documentElement.style.background = c;
  }

  // Heure par défaut : maintenant + 5 min
  var d = new Date(Date.now() + 5 * 60000);
  hh.value = pad(d.getHours());
  mm.value = pad(d.getMinutes());

  function onInput(inst, limit, next) {
    inst.className = "t";
    var v = inst.value.replace(/[^0-9]/g, "").slice(0, 2);
    if (v.length === 2 && parseInt(v, 10) > limit) v = String(limit);
    if (v !== inst.value) inst.value = v;
    if (v.length === 2) { if (next) next.focus(); else inst.blur(); }
  }
  hh.addEventListener("input", function () { onInput(hh, 23, mm); });
  mm.addEventListener("input", function () { onInput(mm, 59, null); });
  function onFocus() { var el = this; setTimeout(function () { try { el.select(); } catch (e) {} }, 50); }
  function onBlur() { if (this.value.length === 1) this.value = "0" + this.value; }
  hh.addEventListener("focus", onFocus); mm.addEventListener("focus", onFocus);
  hh.addEventListener("blur", onBlur); mm.addEventListener("blur", onBlur);

  function start() {
    hh.blur(); mm.blur();
    var h = parseInt(hh.value, 10), m = parseInt(mm.value, 10);
    if (isNaN(h) || isNaN(m) || h > 23 || m > 59) {
      hh.className = "t bad"; mm.className = "t bad"; return;
    }
    var t = new Date();
    t.setHours(h, m, 0, 0);
    target = t; running = true; update();
  }
  function stop() {
    running = false; target = null;
    lcd.innerHTML = "00:00:00";
    setBg("normal");
  }
  $("go").addEventListener("click", start);
  $("stop").addEventListener("click", stop);

  function update() {
    var now = new Date();
    live.innerHTML = "Heure actuelle : " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    if (running && target) {
      var rem = Math.floor((target.getTime() - now.getTime()) / 1000);
      if (rem <= 0) { lcd.innerHTML = "00:00:00"; setBg("zero"); return; }
      var h = Math.floor(rem / 3600), m = Math.floor((rem % 3600) / 60), s = rem % 60;
      lcd.innerHTML = pad(h) + ":" + pad(m) + ":" + pad(s);
      if (rem > 600) setBg("green");
      else if (rem > 300) setBg("orange");
      else if (rem > 60) setBg("red");
      else { flash = !flash; setBg(flash ? "flash_on" : "flash_off"); }
    } else if (!target) {
      setBg("normal");
    }
  }

  layout();
  setTimeout(layout, 300);
  update();
  setInterval(update, 1000);

  // Fonctionnement hors-ligne (iOS 11.3+)
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }
})();
</script>
</body>
</html>
